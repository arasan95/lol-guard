name: release
on:
  push:
    tags:
      - 'v*'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --manifest-path tools/lol-guard/Cargo.toml
      - run: gh release create "${{ github.ref_name }}" --generate-notes "tools/lol-guard/target/release/lol-guard.exe"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
