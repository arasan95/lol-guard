name: release
on:
  push:
    tags:
      - 'v*'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --manifest-path tools/lol-guard/Cargo.toml
      - name: Attach exe to release (idempotent)
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" tools/lol-guard/target/release/lol-guard.exe --clobber
          else
            gh release create "${{ github.ref_name }}" --generate-notes tools/lol-guard/target/release/lol-guard.exe
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
